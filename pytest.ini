[pytest]
testpaths = .
python_files = test_*.py
addopts = -ra --strict-markers
markers =
    smoke: basic CLI verification and critical path (STD 3.1)
    unit: isolated parsing / geometry / sampling tests (STD 3.2)
    e2e: complete pipeline, NRRD in -> MP4 out (STD 3.3)
    regression: guards against silent changes in rendering logic (STD 3.4)
    performance: throughput, load and stress tests (STD 3.5)
